<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">My To-Do List</a>
        </div>
    </nav>

    <main class="container my-5">
        <div class="todo-card mx-auto">
            <h1 class="text-center mb-4">My Tasks</h1>

            <form id="taskForm" class="d-flex gap-2">
                <input
                    type="text"
                    id="taskInput"
                    class="form-control"
                    placeholder="Enter a new task">

                <button type="submit" class="btn btn-primary">
                    Add Task
                </button>
            </form>

            <p id="errorMessage" class="text-danger mt-2"></p>

            <div class="d-flex flex-wrap gap-2 my-4">
                <button class="btn btn-outline-primary filter-btn"
                    data-filter="all">All</button>

                <button class="btn btn-outline-primary filter-btn"
                    data-filter="active">Active</button>

                <button class="btn btn-outline-primary filter-btn"
                    data-filter="completed">Completed</button>
            </div>

            <ul id="taskList" class="list-group"></ul>

            <div class="d-flex justify-content-between align-items-center
                        flex-wrap gap-2 mt-4">
                <p id="taskCounter" class="mb-0">0 tasks left</p>

                <button id="clearCompleted"
                    class="btn btn-danger btn-sm">
                    Clear Completed
                </button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
